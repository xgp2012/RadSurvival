# =====================================================================
# RadSurvival 配置（plan.md §3 草案全量落地）
# 非法值启动即报错并拒绝服务；/rad reload 非法时保留旧配置。
# =====================================================================

# 世界白名单（与 dimensions 取交集，均满足才结算）；校验：不可为空
enabled-worlds: [world]

# 生效维度（仅主世界有太阳；下界 NETHER / 末地 THE_END 默认豁免，豁免时腐蚀只降不升）
# 合法值：NORMAL / NETHER / THE_END
dimensions: NORMAL

# 伤害结算间隔（tick）。校验下限 20：原版玩家受击后有 20 tick 无敌帧，
# 窗口内 damage() 会被静默吞掉，低于 20 会导致“腐蚀在涨但血不掉”（§1.3）
tick-interval: 20

# 白天露天基准伤害（半心/s；MC 生命上限仅 20 点，基准过高会秒杀，生存预算见 §1.6）
base-damage: 1.0

# 参与伤害结算的游戏模式；创造/旁观无条件免疫，冒险可按需开关
# 合法值：SURVIVAL / ADVENTURE / CREATIVE / SPECTATOR
damage-game-modes: [SURVIVAL, ADVENTURE]

# true = 仅“站在地面上”（isOnGround）才结算（需求字面口径）；默认 false = 露天即算
require-on-ground: false

# 夜晚伤害系数（同一露天判定在夜晚成立时 伤害 ×0.5）；校验 ∈ [0,1]
night-multiplier: 0.5

# 黎明/黄昏是否按线性插值缩放 timeFactor（false = 硬切换，避免瞬间跳变，§1.2）
smooth-transition: true

# 玻璃等透明方块是否算作遮蔽（true = 玻璃顶也算室内安全，§6 误判对策）
transparent-blocks-count-as-cover: true

# 露天扫描异步化（§2 线程模型的异步化预留项，本轮落地）：true（默认）= 段缓存 60s 过期后的
# 补扫交给 Bukkit 异步池，当轮沿用上一已知判定（≤1 结算周期的新鲜度滞后），主线程零方块扫描；
# 冷启动首扫仍在主线程同步执行 → 首轮判定精确度不变。伤害/事件/HUD/PDC 一律主线程。
# 玩法与公式完全不受影响；想杜绝 1s 滞后可设 false 回退全同步旧口径。
async-exposure-scan: true

# 盔甲减免模型：减免 = Σ(部位权重 × 材质系数)，空槽计 0（§1.4）
#
# ⚠ v1.2 全面削弱：旧口径「全套下界合金 = 1.00 = 完全免疫」已移除。
#   现在任何盔甲都只能减伤、不能免伤，阳光始终保有最低杀伤力（见下方 min-damage）。
#   旧值 → 新值：皮革 .25→.15、金/锁链 .45→.30、铁 .70→.48、钻石 .85→.60、下界合金 1.00→.72；
#   部位权重 头盔 .20→.12、胸甲 .40→.46、护腿 .30→.30、靴子 .10→.12。
#   全部材质「全套」满配减免：皮革 15% / 金·锁链 30% / 铁 48% / 钻石 60% / 下界合金 72%。
armor:
  # 部位权重，校验各值 ∈ [0,1]；胸甲权重最高，符合「护住要害」的直觉
  slot-weights: {helmet: 0.12, chestplate: 0.46, leggings: 0.30, boots: 0.12}
  # 材质系数，键必须属于 {LEATHER,GOLD,CHAINMAIL,IRON,DIAMOND,NETHERITE}，值 ∈ [0,1]
  # 校验要求：白名单内任一套装满配后 < 1.0（禁止任何材质通向完全免疫——v1.2 硬约束）
  material-factors: {LEATHER: 0.15, GOLD: 0.30, CHAINMAIL: 0.30, IRON: 0.48, DIAMOND: 0.60, NETHERITE: 0.72}
  # 最低杀伤保底：即使减免再高，单轮辐射伤害也不低于「base × timeFactor × 腐蚀倍率 × 本值」
  # 校验 ∈ (0,1]。默认 0.10 = 最强防护下仍承受 10% 的阳光伤害，杜绝「穿甲挂机永不掉血」
  min-damage-fraction: 0.10

# 腐蚀条系统：露天随时间累积腐蚀度（0~100%），腐蚀越高辐射伤害越高（§1.6）
corrosion:
  # 是否启用腐蚀条（关闭则伤害不随暴露时长放大）
  enabled: true
  # 白天露天累积速率 %/s（夜晚自动 × night-multiplier）
  day-accum-per-sec: 1.0
  # 遮蔽/豁免维度时恢复速率 %/s（仅在线生效，离线冻结）
  regen-per-sec: 1.0
  # 盔甲减免是否同时作用于累积速率（true = 重甲同时拖慢腐蚀累积速度）
  # v1.2 默认系数下最高减免 72%，累积速率至少保留 28%（下界合金）
  armor-affects-accum: true
  # 腐蚀 100% 时的伤害倍率上限；校验 ≥ 1（0% ≈ ×1.0，100% ≈ ×maxMultiplier）
  max-multiplier: 2.0
  # 放大曲线：linear | sqrt | exp（非线性预留：先缓后爆 / 先高后猛手感）
  curve: linear
  # 死亡清零；与 decay-on-death 互斥（二选一）
  reset-on-death: true
  # 死亡按比例保留（如 0.5 = 减半不清零）；校验 ∈ (0,1)，仅当 reset-on-death: false 时可设
  # decay-on-death: 0.5
  # 播报阶段阈值（%）：穿越 warn/danger 时 title+音效提示（M3 接线）
  stages: {warn: 50, danger: 75}

# 反馈表现（默认开启，可关；M3 实现 HUD 双条/阶段播报/粒子/音效/死亡文案）
feedback:
  # Action bar 双条（辐射等级条 + 腐蚀条），独立 1s 周期任务（与结算任务解耦）
  actionbar: true
  # 受击时轻微粒子（1.21.11 无 WIHN 枚举时自动降级为最接近的烟雾类，见实现注释）
  particles: true
  # 受击低功耗音效；阶段跳变播报（warn/danger title+音效、回档减轻提示）同随本开关
  sound: true
  # 玩家死于辐射结算（掉血归因 + 结算时间窗双保险，不误伤其他死因）时替换废土风死亡文案
  death-message: true
  # true = 腐蚀条改用 BossBar 常驻显示（屏幕顶部），actionbar 仅显示辐射等级条
  bossbar-corrosion: false
  # ProtocolLib 增强：auto | true | false —— 仅做「抑制原版受伤红闪」一件低风险事，
  # 检测不到 / 异常时自动留桩降级；包级 HUD 全量替换为 §4 扩展（本期不做）
  protocol-lib: auto

# 命令相关
commands:
  # /rad reload 所需权限节点（console 与持有该节点的玩家可执行）
  reload-permission: radsurvival.reload

# =====================================================================
# 抗尘埃药（v1.2 新增）
# =====================================================================
# 制作：竖着叠三格 —— 最上面铁砧、中间发射器（Dropper 亦可）、最下面铁块；
# 把农作物放进发射器 UI 的「中心格」，再手持木棍右键最上面那格铁砧 → 产出一瓶对应档位的抗尘埃药。
# （v1.2 曾要求「同层 8 邻一圈原木」，现已取消：四个水平方向放什么都不参与判定。）
# 服用：吃掉后立刻降低腐蚀值，并进入一段时间的辐射免疫；同时获得一段使用冷却。
anti_dust:
  # 总开关：false = 不注册监听器，发射器行为退回原版
  enabled: true
  # 同一玩家两次服药的冷却秒数（校验 ≥ 0；0 = 无冷却）
  # 注意：本插件不写原版 USE_COOLDOWN 组件，否则会与食物/药水共用全局冷却标签
  cooldown-seconds: 20
  # 服药瞬间无条件解除的中毒类效果（给「药」应有的可信度）
  cures: [POISON, HUNGER, NAUSEA, WEAKNESS, SLOWNESS]
  # 免疫期间 HUD 上显示的抗性段文本（不能为空）
  # 注：历史版本此键误拼为 hud-immume-mark（双 m），旧拼写仍被兼容读取；
  #     两种同时存在时以本键（hud-immune-mark）为准。
  hud-immune-mark: "◆抗尘"
  # 档位表：作物 → 档位。同一作物只取第一个匹配的档位（顺序 = 由强到弱）
  # 未出现在任何档位里的物品 → 中心格拒收（GUI 提示「不是有效的抗尘埃原料」）
  # reduction = 服药瞬间降低的腐蚀值（百分点，校验 (0,100]）
  # immune-seconds = 免疫时长（秒，校验 ≥ 0）
  # color = 该档位物品名的颜色与药水染色提示（HEX，校验 #RRGGBB）
  # items 必须是合法物品枚举名，非法值启动即报错（禁止静默忽略）
  levels:
    refined:
      display-name: 精制抗尘埃药
      color: "#8FE3C4"
      reduction: 50.0
      immune-seconds: 30
      items: [GOLDEN_CARROT, CHORUS_FRUIT, GLOW_BERRIES, ENCHANTED_GOLDEN_APPLE]
    strong:
      display-name: 强效抗尘埃药
      color: "#63D19B"
      reduction: 35.0
      immune-seconds: 20
      items: [NETHER_WART, CRIMSON_FUNGUS, WARPED_FUNGUS, SWEET_BERRIES]
    improved:
      display-name: 改良抗尘埃药
      color: "#C8B560"
      reduction: 25.0
      immune-seconds: 15
      items: [PUMPKIN, MELON_SLICE, SUGAR_CANE, COCOA_BEANS, BROWN_MUSHROOM, RED_MUSHROOM]
    crude:
      display-name: 粗制抗尘埃药
      color: "#9AA35A"
      reduction: 15.0
      immune-seconds: 10
      items: [WHEAT, CARROT, POTATO, BEETROOT, KELP, DRIED_KELP, BAMBOO, CACTUS]
